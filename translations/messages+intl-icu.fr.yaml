        legend: "Vous avez perdu votre mot de passe ? Entrez votre email et on vous envoie un lien pour le récupérer !"
        success:
            title: "Email de récupération envoyé !"
            legend: "Un email pour récupérer votre compte vous a été envoyé, surveillez votre boite mail."
